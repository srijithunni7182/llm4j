<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article desk</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  input[type=text] { width: 70%; padding: .5rem; }
  button { padding: .5rem 1rem; margin-left: .25rem; cursor: pointer; }
  #question { white-space: pre-wrap; background: #fff8e1; border: 1px solid #e6c200; padding: 1rem; margin: 1rem 0; display: none; }
  #log { font-family: ui-monospace, monospace; font-size: .85rem; color: #444; white-space: pre-wrap; }
  #spend { margin-top: 1rem; color: #666; font-size: .9rem; }
  #result { margin-top: 1rem; font-weight: 600; }
</style>
</head>
<body>
<h1>Article desk</h1>
<p>Type a topic. An agent writes the article, you approve it here, and only then is it saved.</p>
<p><input id="topic" type="text" placeholder="home composting for a small balcony"> <button id="go">Write</button></p>
<div id="question"><div id="qtext"></div><p><button id="yes">Approve and save</button> <button id="no">Throw it away</button></p></div>
<div id="result"></div>
<div id="log"></div>
<div id="spend"></div>
<script>
const $ = id => document.getElementById(id);
async function post(path, body) { return fetch(path, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) }); }
$('go').onclick = async () => { const r = await post('/api/run', { topic: $('topic').value }); if (!r.ok && r.status === 400) alert('Type a topic first.'); };
$('yes').onclick = () => post('/api/answer', { answer: 'yes' });
$('no').onclick = () => post('/api/answer', { answer: 'no' });
async function refresh() {
  const s = await (await fetch('/api/state')).json();
  const waiting = s.status === 'waiting';
  $('question').style.display = waiting ? 'block' : 'none';
  $('qtext').textContent = waiting ? s.question : '';
  $('go').disabled = s.status === 'running' || waiting;
  $('log').textContent = s.transcript.join('\n');
  $('result').textContent = s.status === 'done' ? s.result : s.status === 'failed' ? 'The run failed: see the log.' : '';
  $('spend').textContent = s.calls === undefined ? '' : 'Spent so far: ' + s.calls + ' model calls, ' + s.tokens + ' tokens' + (s.cost ? ', $' + s.cost : '');
}
setInterval(refresh, 700); refresh();
</script>
</body>
</html>
