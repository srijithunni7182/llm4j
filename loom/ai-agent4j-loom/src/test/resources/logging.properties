# The engine logs every workflow start, agent and statement at INFO and each lint note at WARNING. The tests run thousands of workflows
# (the replay, rewind and ladder property tests), which floods the build log. Errors still show.
handlers = java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level = ALL
io.github.llm4j.loom.execution.HarnessExecutor.level = SEVERE
