name: Build, Validate, and Deploy

# See docs/TESTING_STRATEGY.md for what each build runs and docs/PUBLISHING.md for how a release is made.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at midnight
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Maven Central (a release build; needs the secrets listed in docs/PUBLISHING.md)'
        type: boolean
        default: false
      auto_publish:
        description: 'With deploy: publish at once instead of leaving the upload for review in the Central Portal'
        type: boolean
        default: false

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'maven'

    # The default build: fast, hermetic tests and the coverage gates, for every published library.
    - name: Build and test
      run: mvn -B verify

    - name: Upload test and coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports-jdk${{ matrix.java }}
        path: |
          **/target/surefire-reports/
          **/target/site/jacoco/

  release-check:
    name: Release check (sources, javadoc, metadata)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # Builds the jars a release uploads, unsigned. Tests ran in the build job.
    - name: Build the release artifacts without signing
      run: mvn -B -Prelease -Dgpg.skip=true -DskipTests verify

    - name: Keep the runnable weave jar
      uses: actions/upload-artifact@v4
      with:
        name: weave-cli-jar
        path: loom/ai-agent4j-loom/target/ai-agent4j-loom-*-cli.jar

  extended-tests:
    name: Extended tests (integration, fragile, examples)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run the extended profile
      run: mvn -B -fae -Pextended verify

    - name: Test Loom CTK
      run: mvn -B test
      working-directory: loom/ctk

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: extended-reports
        path: '**/target/surefire-reports/'

  security-scan:
    name: OWASP Dependency Check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    - name: Scan the published libraries
      run: mvn -B org.owasp:dependency-check-maven:check -DnvdApiKey=${{ secrets.NVD_API_KEY }}

  deploy:
    name: Deploy to Maven Central
    needs: [build, release-check]
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # server-username, server-password and gpg-passphrase name the ENVIRONMENT VARIABLES that hold the values (set on the deploy step below).
    - name: Set up JDK 17 for deployment
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        server-id: central
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_PASSWORD
        gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    # The tests run again here: a release is never uploaded without them.
    - name: Deploy the libraries (one bundle, signed)
      run: mvn -B -Prelease -Dcentral.autoPublish=${{ inputs.auto_publish || 'false' }} deploy
      env:
        CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
