name: Build, Validate, and Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at midnight
  workflow_dispatch:

jobs:
  core-unit-tests:
    name: Core Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        server-id: central
        server-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        server-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
        gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

    - name: Build and Test Core (ai-agent4j)
      run: |
        mvn -B clean install -DskipTests=false
      working-directory: ai-agent4j
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    - name: Build and Test Addons (ai-agent4j-addons)
      run: |
        mvn -B clean install -DskipTests=false
      working-directory: ai-agent4j-addons
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          ai-agent4j/target/surefire-reports/
          ai-agent4j-addons/target/surefire-reports/

  app-smoke-builds:
    name: App Smoke Builds
    runs-on: ubuntu-latest
    needs: core-unit-tests
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Install Core
      run: mvn -B clean install -DskipTests
      working-directory: ai-agent4j

    - name: Install Addons
      run: mvn -B clean install -DskipTests
      working-directory: ai-agent4j-addons

    - name: Compile Hexamind Hub
      run: mvn -B -DskipTests compile
      working-directory: examples/hexamind-hub

    - name: Compile Nirmaan Yantra Server
      run: mvn -B -DskipTests compile
      working-directory: examples/nirmaan-yantra/nirmaan-yantra-server

    - name: Compile Kingini
      run: mvn -B -DskipTests compile
      working-directory: examples/kingini

    - name: Compile Gmail MCP App
      run: mvn -B -DskipTests compile
      working-directory: examples/gmail-mcp-app

  deep-integration-tests:
    name: Deep Integration Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Core Integration Profile
      run: mvn -B -Pintegration-tests verify
      working-directory: ai-agent4j

    - name: Run Addons Integration Profile
      run: mvn -B -Pintegration-tests verify
      working-directory: ai-agent4j-addons

  security-scan:
    name: OWASP Dependency Check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Run Core Scan
      run: mvn org.owasp:dependency-check-maven:check -DnvdApiKey=${{ secrets.NVD_API_KEY }}
      working-directory: ai-agent4j
    - name: Run Addons Scan
      run: mvn org.owasp:dependency-check-maven:check -DnvdApiKey=${{ secrets.NVD_API_KEY }}
      working-directory: ai-agent4j-addons

  deploy:
    name: Deploy to Maven Central
    needs: [core-unit-tests, app-smoke-builds]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17 for Deployment
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: central
        server-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        server-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

    - name: Import GPG signing key
      env:
        GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        echo "$GPG_SECRET_KEY" > private.key
        mkdir -p ~/.gnupg
        chmod 700 ~/.gnupg
        gpg --batch --import private.key
        rm private.key

    - name: Deploy Core
      run: mvn -B -Dgpg.executable=gpg -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}" -Dgpg.pinentry-mode=loopback deploy -P release -DskipTests
      working-directory: ai-agent4j
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    - name: Deploy Addons
      run: mvn -B -Dgpg.executable=gpg -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}" -Dgpg.pinentry-mode=loopback deploy -P release -DskipTests
      working-directory: ai-agent4j-addons
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
