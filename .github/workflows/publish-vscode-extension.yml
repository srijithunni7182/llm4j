name: Publish the VS Code extension

# Publishes src/loom/vscode-loom to the Visual Studio Marketplace when a change to it lands on main and package.json has a version
# the Marketplace does not have yet. It uses Trusted Publishing (OpenID Connect), so no token is stored in this repository.
# The Marketplace never takes a version twice, so a pull request that changes the extension must bump the version: the check
# on the pull request fails without it. The one-time setup and how a release works are in docs/PUBLISHING_VSCODE.md.
#
# A change to the engine that the extension carries (src/loom/ai-agent4j-loom) does not start a release by itself; it ships
# with the next extension version, which rebuilds weave.jar from main.

on:
  push:
    branches: [ main ]
    paths:
    - 'src/loom/vscode-loom/**'
    - '!src/loom/vscode-loom/test/**'
    - 'scripts/build-vsix.sh'
    - 'scripts/verify-vsix.sh'
    - 'scripts/check-extension-release.sh'
    - 'scripts/published-extension-version.sh'
    - '.github/workflows/publish-vscode-extension.yml'
  pull_request:
    branches: [ main ]
    paths:
    - 'src/loom/vscode-loom/**'
    - '!src/loom/vscode-loom/test/**'
  workflow_dispatch:

permissions:
  contents: read

# A second merge waits for the first to finish, so it sees the version the first one published and does not upload it again.
# Pull request checks have a group of their own per pull request: GitHub keeps one pending run per group, and a check must
# never push out a pending publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('publish-vscode-extension-pr-{0}', github.ref) || 'publish-vscode-extension' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap, and the only job a pull request runs. On a pull request the version must be newer than the one on main; on main it
  # must be newer than the one on the Marketplace, and when it is not there is simply nothing to publish.
  release-check:
    name: Is there a new version to publish?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # The branch name comes from whoever opened the pull request, so it goes in through the environment and is never written into a command.
    - name: Decide
      id: decide
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = "pull_request" ]; then
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          baseline="$(git show FETCH_HEAD:src/loom/vscode-loom/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          bash scripts/check-extension-release.sh --require-bump "$baseline"
        else
          baseline="$(bash scripts/published-extension-version.sh)"
          bash scripts/check-extension-release.sh "$baseline"
        fi

  build:
    name: Build and check the package
    needs: release-check
    if: github.event_name != 'pull_request' && needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Builds weave.jar from this commit, packages the extension around it, then unpacks the package and runs the bundled jar.
    - name: Build the package
      run: bash scripts/build-vsix.sh

    - name: Check the package
      run: bash scripts/verify-vsix.sh

    # The tests that need no VS Code download and no browser. latency is left out: it times the engine's start-up, which a shared runner can slow.
    - name: Test the extension
      working-directory: src/loom/vscode-loom
      run: |
        npx tsc -p tsconfig.test.json
        node --test $(ls out-test/test/*.test.js | grep -v -E 'integration|browser|latency')

    - name: Keep the package
      uses: actions/upload-artifact@v4
      with:
        name: vsix
        path: src/loom/vscode-loom/*.vsix
        if-no-files-found: error
        retention-days: 30

  # Only this job may publish. It runs nothing from the repository: it takes the package the build job made and hands it to a
  # pinned vsce, with an OpenID Connect token that the Marketplace trusts for this repository, this workflow file and this
  # environment. Limit the environment to the main branch (see docs/PUBLISHING_VSCODE.md), so a run from another branch cannot publish.
  publish:
    name: Publish to the Marketplace
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: vsix
        path: vsix

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Publish
      run: |
        set -euo pipefail
        files=(vsix/*.vsix)
        [ "${#files[@]}" -eq 1 ] || { echo "Expected one .vsix, found ${#files[@]}." >&2; exit 1; }
        npx --yes @vscode/vsce@4.0.0 publish --oidc --packagePath "${files[0]}"
