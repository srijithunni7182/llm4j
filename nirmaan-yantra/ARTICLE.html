# Nirmaan Yantra: A Tribute to the Art of Software Engineering

![Nirmaan Yantra Header](img/header.png)

*(Or: How I Built an AI Software Factory and Learned to Respect the Human Development Process)*

## 1. The Journey So Far

For the past few months, I’ve been obsessed with a single question: **Can we make Java and AI play nice?**

It started with a simple experiment. Python developers have all the fun with LangChain and AutoGen, while we Java developers are often left parsing JSON strings manually. So, I built **[gemini-react-java](https://medium.com/@srijith.unni/i-built-a-google-gemini-agent-in-java-so-you-dont-have-to-709a46cf4d5e)**. It was a library designed to give Java natives a clean, fluent API to interact with Google’s Gemini models.

But a library is just a tool. It needs a playground.

That led to **[Hexamind Hub](https://medium.com/@srijith.unni/the-day-my-ai-agents-started-arguing-in-a-boardroom-f22138c9a0b2)**. I wanted to see if agents could collaborate. I built a virtual "Boardroom" where agents like Sasha (The Futurist) and Rahul (The Pragmatist) debated strategy. It was fascinating, but it was... talk.

We have enough chatbots. The world is drowning in agents that *suggest* solutions. I wanted to build something that *executes* them.

I wanted to move from **Talking** to **Doing**.

## 2. Enter Nirmaan Yantra: The Construction Machine

**Nirmaan Yantra** (Sanskrit for "Construction Machine") is not a chatbot. It is a factory.

The inspiration for this project comes from the history of the **Indian IT Industry**. For decades, India has been the boiler room of the global digital economy. But the immense success of companies like Infosys, TCS, and Wipro wasn't just about labor arbitrage. It was about **Process**.

It was about taking a chaotic, vague requirement from a client in New York, passing it through layers of rigorous analysis, architecture, coding, testing, and QA in Bangalore or Hyderabad, and shipping a robust enterprise-grade product. Millions of Indian software engineers didn't just write code; they followed a disciplined *industrial* workflow.

Nirmaan Yantra is a tribute to that discipline. It attempts to codify that human process into a team of autonomous AI agents.

But I didn't just want "Worker 1" and "Worker 2". I wanted to capture the **intellectual tension** of a real software team. So, I carved the process into distinct personas, each with a conflicting directive:

* **Aditi (Product Manager)**: The Visionary. Her job is to dream big and ignore technical constraints.
* **Rishi (Architect)**: The Prudent Planner. His job is to look at Aditi's dream and say, "That doesn't scale," effectively grounding it in reality.
* **Vihaan (Developer)**: The Optimist. He believes he can build anything in 10 lines of code.
* **Dhruv (Build Engineer)**: The Realist. He executes the build. If it doesn't compile or the tests fail, he ruthlessly rejects it.
* **Drishti (QA Engineer)**: The Skeptic. She writes the End-to-End tests specifically to break what Vihaan built.
* **Vishnu (Release Manager)**: The Gatekeeper. He doesn't care if it works; he cares if it's *maintainable*.

By giving them these opposing personalities, Nirmaan doesn't just "generate code"; it **debates** it. The friction between Drishti's extreme testing and Vihaan's optimism is exactly what refines the final product.

## 3. The Blueprint: Why Docs Matter

The biggest mistake we make with LLMs is treating them like magic genies. "Build me a Snake Game," we say. And the LLM spits out a single file of Python spaghetti.

Real software doesn't work like that.

In Nirmaan, nothing gets built without a **Blueprint**.

* **Aditi (The Product Manager)** takes your one-line idea and generates a detailed **Product Requirements Document (PRD)**.
* **Rishi (The Architect)** analyzes Aditi's PRD and creates the **Technical Specification**, **Architecture**, and **Test Strategy**.
* This isn't busywork. It's **Context Anchoring**. When the developer agent (Vihaan) forgets a variable name 50 turns later, he doesn't guess—he looks at Rishi's spec.

## 4. The Manufacturing Line (Parallel Architecture)

To mimic a real software house, Nirmaan runs on parallel tracks:

* **Track A (The Builders):** Vihaan begins the implementation loop.
* **Track B (The Testers):** Concurrently, **Drishti (QA)** sets up the End-to-End (E2E) testing environment.

This parallel execution—implemented with Java's \`CompletableFuture\`—is crucial. It ensures that by the time the code is ready, the rigorous test harness is already waiting for it.

## 5. The TDD Loop: A Horror Story

The core engine of Nirmaan is **Test-Driven Development (TDD)**. And honestly? It was a nightmare to implement.

**Vihaan (The Lead Dev)** writes a failing test (Red Phase).
**Dhruv (The Build Engine)** executes it to confirm failure.
**Vihaan** then writes the code to pass it (Green Phase).

Sounds simple? Here’s what actually happens:

1. Vihaan hallucinates a library that doesn't exist.
2. The code fails to compile.
3. Vihaan apologizes and "fixes" it by importing *another* library that doesn't exist.
4. Infinite loop.

To solve this, we had to implement **Self-Healing loops**:

* **Smart Context**: Agents now read \`pom.xml\` and build logs. They don't just guess; they investigate.
* **Fresh Start Strategy**: If Vihaan fails 5 times in a row, Nirmaan pulls the plug. It wipes the implementation and forces a "Fresh Start" from the Spec. It stops the agent from digging its own grave.

## 6. The Quality Control

After the code is built, it enters the **Review Loop**.
**Vishnu (The Gatekeeper)** performs a line-by-line review. He doesn't just check for bugs; he checks for *Spec compliance*. If he rejects it, the loop restarts.

Finally, **Drishti** runs the E2E suite. If that fails, she doesn't just log an error. She updates the **Spec** itself, forcing the entire team to realign their understanding of the problem.

## 7. An Epiphany: The Infinite Complexity of "Human" Workflows

Building Nirmaan Yantra taught me one thing: **Human software engineering is not a straight line; it is an infinitely intricate web of loops.**

We often see demos of tools like **n8n** or **CrewAI** executing linear chains: *Trigger -> Search -> Summarize -> Email*. It looks clean. It looks automatable.
But software development is never linear. It is a chaotic, beautiful dance of **loops within loops**.

A developer writes code (*Logic Loop*), runs it (*Execution Loop*), sees a glitch (*Debugging Loop*), pushes it, gets a code review (*Social Loop*), demos it to a Product Manager (*Business Loop*), and realizes the UX feels "off" (*Multimodal Loop*).

Trying to codify this into agents was a humbling experience.

* **Multimodal Processing**: Humans look at a screen and *feel* if an animation is janky. Agents simply verify that the CSS class exists.
* **Decision Making**: Humans know when to accrue technical debt for speed vs. when to refactor. Agents only know "Pass/Fail".
* **Collaborative Debugging**: The "It works on my machine" conversation is a high-bandwidth data exchange that no current LLM context window can fully capture.

Nirmaan attempts to simulate just the **TDD and Review loops**. And even that was incredibly hard. It proved to me that "Human Collaborative Development" is perhaps the most sophisticated cognitive workflow on the planet. We aren't just typing; we are navigating a decision tree that is constantly rewriting itself.

## 8. The Technical Reality: Why It's Hard to Clone an IDE

Nirmaan represents the "Text-based" approach to coding. It reads files as strings and writes strings. It's powerful, but it's brittle.

**Abstract Syntax Trees (AST)** allow a system to see code not as a stream of text, but as a hierarchical tree of logic. Instead of predicting the next token based on probability (like ChatGPT does), an AST-aware tool understands that \`User user = new User()\` creates a dependency. It knows the difference between a variable definition and a function call because it sees the nodes of the tree, not just the characters "u-s-e-r".

**LSP (Language Server Protocol)** takes this a step further. It is the standardized protocol that powers your IDE's intelligence (VS Code, IntelliJ). When you type \`person.\`, and a popup shows \`getName()\` and \`getAge()\`, that is LSP in action. It connects the editor to a "Language Server" that understands the project's entire graph.

The difficult reality is that **LLMs don't think in ASTs**. They think in tokens.
Simulating the workflow of a human using an IDE—where they constantly jump to definitions, check types, and rely on red squiggles—is incredibly hard for an agent. Nirmaan tries to bridge this gap by force (running the compiler and feeding back errors), but it lacks the instant, structural intuition that a Language Server provides. True dominance in AI coding will come when agents stop guessing text and start querying the Language Server like a human does.

This is why tools like **Replit** and **Cursor** feel so magical. They **own the environment**. Their agents sit *inside* the runtime, hooking directly into the LSP to validate code before they even suggest it. They don't have to wait for a 2-minute Maven build to know they missed an import; the red squiggle tells them in 10 milliseconds. Nirmaan Yantra is the **Remote Factory**—powerful but external. Replit is the **Bionic Brain**—integrated and immediate.

## 9. A Few Takeaways

I built all of this using **Antigravity**, and it reinforced a powerful truth: in today's world, we are only limited by our ideas. These powerful tools can help us grow into superlative engineers. The **Human-in-the-loop** remains essential; the mythical "10x engineer" is a relic of the past, but with these tools, we can aim to become **100x engineers**.

It is vital to learn by building. Here are a few thoughts I wanted to share from this experience:

### Tests for Validation

Always insist on generating tests alongside code, whether unit or integration tests. I found it incredibly useful to sometimes consciously step back—to be the Human *outside* the loop—and allow the tools to run an integration test and handle the **Run, Debug, Fix** loop independently.

### Logs are Divine

Always insist on comprehensive logging. Generated code often lacks this by default, but logs are crucial for efficient agentic coding. Since logs are essentially text—an LLM's favorite diet—tools like Antigravity or Copilot can trace and debug issues much faster when they can "read" exactly what happened.

### Iterative Polishing

A good idea is just the seed; it must be nourished through continuous testing and feedback. Build fast, run often, review the code, and then provide further instructions. This tight **Feedback Loop** is essential to extract the best work from these tools.

### Code Re-use vs. Generation

AI is excellent at generating *new* code, but often average at *re-use*. For instance, Antigravity didn't intuitively create a base class for the agents to log their thoughts; it duplicated the code across per agent. An experienced OOP/Java developer would naturally abstract this.
**Lesson:** Leverage the speed of AI generation, but enhance it with meticulous human review for architecture and patterns. Once you give that high-level feedback, the machine can handle the implementation.
