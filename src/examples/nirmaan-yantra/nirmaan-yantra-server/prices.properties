# model = input / output, per million tokens, in dollars. Prices change: check your provider before trusting a cost cap.
# The name must be written exactly as the script's `model:` is (gemini-2.5-flash, not gemini/gemini-2.5-flash): a table key with a
# provider prefix never matches a model written without one.
# Used as: weave run src/main/resources/main.loom --prices prices.properties ...
gemini-2.5-flash = 0.30 / 2.50
gemini-2.5-pro   = 1.25 / 10.00
