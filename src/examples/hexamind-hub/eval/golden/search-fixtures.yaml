# Recorded search results for the evaluation: a query that matches an entry's regex (case-insensitive) is answered
# with its snippets; no match means "No results found." (which is what a fabricated term must get).
# A scenario's own retrievalContext, when it has one, takes priority over this library.
# The snippets are short, well-known public facts written for the test; they are not live search results.
- id: post-quantum-tls
  match: 'post.?quantum|pqc|ml-kem|kyber|\btls\b|\bvpn\b|key (exchange|agreement|encapsulation)'
  snippets:
  - '[Standard] NIST FIPS 203 (August 2024) standardizes ML-KEM (derived from CRYSTALS-Kyber). ML-KEM-768 public keys are 1,184 bytes and ciphertexts 1,088 bytes, against 32 bytes for an X25519 key share.'
  - '[Engineering blog] Browsers and large CDNs have deployed the hybrid key agreement X25519MLKEM768 in TLS 1.3 by default; the larger ClientHello can break some middleboxes and legacy appliances that mishandle fragmented or oversized handshakes.'
  - '[Guidance] Migration guidance from national agencies recommends a cryptographic inventory first, then hybrid key exchange for confidentiality, because recorded traffic can be decrypted later ("harvest now, decrypt later"); signature migration is slower and follows.'
- id: solid-state-batteries
  match: 'solid.?state|battery|batteries|electrolyte|grid.?scale|energy storage'
  snippets:
  - '[Review] Solid-state cells replace the liquid electrolyte with a ceramic, sulfide or polymer solid. Open problems are interface resistance, dendrite growth at high current, and manufacturing yield at scale; most programs are at pilot-line or sample stage.'
  - '[News] Several automakers and cell makers have announced pilot lines and target mass production around the end of the decade; no solid-state product is in volume production for grid use today.'
  - '[Market data] Grid-scale storage installed today is overwhelmingly lithium-ion, mainly lithium iron phosphate (LFP), chosen for cost per kWh and cycle life; solid-state cells are currently more expensive per kWh.'
- id: vertical-farming
  match: 'vertical farm|hydropon|greenhouse|horticultur|urban (farm|agricultur|food)|food security|indoor farm'
  snippets:
  - '[News] Several well-funded vertical-farming companies have failed or restructured since 2023, including AeroFarms (Chapter 11, 2023), Bowery (closed, 2024) and Plenty (Chapter 11, 2025), mostly citing energy and capital costs.'
  - '[Review] Vertical farms are commercially viable mainly for leafy greens and herbs; staple crops such as wheat and rice are not economic under artificial light because of the energy needed per kilogram of calories.'
  - '[Journal] Life-cycle studies find greenhouses use far less electricity per kilogram than fully artificial-light vertical farms, while vertical farms use much less water and land; the balance depends on the local grid mix.'
- id: rag-hallucination
  match: 'retrieval.augmented|\brag\b|hallucinat|grounded generation'
  snippets:
  - '[Paper] Lewis et al. (2020) introduced retrieval-augmented generation; later studies show retrieval reduces but does not eliminate hallucination, because the model can ignore or misread the retrieved passages.'
  - '[Journal] A 2024 Stanford evaluation of commercial legal research tools built on retrieval found they still hallucinated on a substantial share of queries, roughly one in six or more, despite vendor claims of being hallucination-free.'
- id: ai-customer-support
  match: 'customer (support|service)|chatbot|support agent|call.?cent|contact.?cent|phone support|first.?line|ai agent.*(bank|support)|(bank|support).*ai agent|cost (saving|reduction)|deflection|older (customers|people|adults)|vulnerable customers|human hand.?off|escalat'
  snippets:
  - '[News] Klarna said in 2024 that its AI assistant handled about two thirds of customer chats, then in 2025 said it was hiring humans again after quality concerns, showing that deflection numbers and satisfaction can diverge.'
  - '[Regulator report] The US CFPB (2023) reported that chatbots in consumer finance can trap customers in loops, give inaccurate answers and fail to provide a way to reach a human, and warned about compliance risk.'
  - '[Legal] In Moffatt v. Air Canada (2024) a tribunal held the airline responsible for wrong refund information given by its website chatbot.'
  - '[Analyst] Cost-reduction figures for AI in customer service come largely from vendor case studies and surveys; independent audited results are scarce and vary widely by use case and by how deflection is counted.'
- id: enterprise-ai-agents
  match: 'enterprise|agentic|ai agents|agent (market|adoption)|market (trend|direction|signal)|software (market|vendors)'
  snippets:
  - '[Analyst] Gartner (June 2025) predicted that over 40 percent of agentic AI projects will be cancelled by the end of 2027 because of cost, unclear value or risk controls, and noted widespread "agent washing" by vendors.'
  - '[Analyst] Gartner also projected that by 2028 about a third of enterprise software applications will include agentic AI, up from under 1 percent in 2024.'
  - '[News] Major enterprise software vendors have launched agent platforms and are shifting pricing toward usage- or outcome-based models.'
- id: warehouse-robots
  match: 'warehouse|humanoid|embodied|logistics|robot'
  snippets:
  - '[News] Amazon reported operating more than 750,000 robots across its fulfilment network (2023), almost all of them wheeled drive units and arms, not humanoids.'
  - '[News] Humanoid robots such as Agility Robotics Digit have been piloted in commercial warehouses (for example tote moving) in small numbers; there is no humanoid fleet at scale doing most warehouse work.'
  - '[Analysis] Bottlenecks cited for general-purpose warehouse robots include dexterity, battery life, safety certification around people, uptime, and total cost versus existing automation.'
- id: retail-cbdc
  match: 'cbdc|central bank digital|digital (euro|rupee|yuan)|e-?cny|enaira|sand dollar'
  snippets:
  - '[Review] Retail CBDC pilots exist in China (e-CNY), India (e-rupee, retail pilot from December 2022), Nigeria (eNaira, low adoption) and the Bahamas (Sand Dollar); adoption has generally been lower than planners expected.'
  - '[Policy] The ECB moved the digital euro into a preparation phase in late 2023; in the US a January 2025 executive order bars federal agencies from promoting a retail CBDC.'
  - '[Analysis] Common concerns are bank disintermediation, privacy and operational resilience; common opportunities are payment efficiency and financial inclusion.'
- id: on-device-llm
  match: 'on.?device|edge (ai|model|inference)|local (llm|model)|small language model|phone.*model|language model.*(phone|device)'
  snippets:
  - '[Vendor] Apple Intelligence (2024) runs a roughly 3-billion-parameter language model on device and falls back to larger server models for harder requests; Google ships Gemini Nano on some Pixel phones.'
  - '[Paper] Microsoft Phi-3-mini (3.8B parameters, 2024) was shown running on a phone, illustrating that small quantized models fit consumer hardware.'
- id: accessibility-color
  match: 'colou?r|wcag|accessib|colou?r.?blind|error (state|message)'
  snippets:
  - '[Standard] WCAG 2.2 Success Criterion 1.4.1 (Use of Color) says colour must not be the only visual means of conveying information, indicating an action or identifying an error; add text, an icon or a pattern.'
  - '[Statistics] About 1 in 12 men and 1 in 200 women have some form of colour vision deficiency, so colour-only error states are missed by a meaningful share of users.'
