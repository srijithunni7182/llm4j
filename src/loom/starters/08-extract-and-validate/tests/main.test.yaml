script: ../main.loom
workflow: Main
cases:
  - name: a readable invoice is returned as fields
    input: { text: "ACME Ltd invoice INV-7, total 120.50 USD" }
    models:
      Invoice: { vendor: "ACME Ltd", invoice_number: "INV-7", total: 120.5, currency: USD }
    expect:
      result: { contains: "INV-7" }
      calls: { Invoice: 1 }
  - name: a total the text does not state is asked of a person, not guessed
    input: { text: "ACME Ltd invoice INV-8" }
    models:
      Invoice: { vendor: "ACME Ltd", invoice_number: "INV-8", currency: USD }
    humans: [ "99" ]
    expect:
      result: { contains: "99" }
  - name: text that cannot be read stops the run on purpose
    input: { text: "hello" }
    models:
      Invoice: "x"
    fail:
      Invoice: { always: true, category: invalid_output }
    expect:
      final: halted
