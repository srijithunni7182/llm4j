# The requirements of this starter, as one end-to-end case: what the run must have done, and what the answer must be.
- id: workflow-001
  name: A normal request
  input: "Can I get a refund?"
  expect:
    - "Support wrote the reply"
    - "Compliance checked it against the house rules"
    - "Editor rewrote a reply that broke a rule"
  rubric:
    - "No reply promises a refund"
    - "A reply Compliance is unsure about is not sent"
