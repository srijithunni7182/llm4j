- id: LC01
  lens: cost
  severity: medium
  about: agent
  requires: [setting.data.top-models]
  when:
    all:
      - { field: model.id, in: { setting: data.top-models } }
      - { field: hasTools, is: false }
      - { field: hasSchema, is: true }
      - { field: inlinePromptLines, lte: 10 }
      - { field: stepCount, gte: 1 }
  title: "Agent {name} looks like a classifier but runs on {model.id}, one of your most expensive models"
  why: "An agent with no tools, a structured answer and a short prompt is picking from a few options. A smaller model usually does that as well for a fraction of the price, and it is paid for on every run."
  fixHint: "Try a smaller model for this agent, or an intentclassifier, and keep the big model for the steps that need it."
  since: "1.1.0"
  explain: >
    This rule needs to know which models you consider expensive, so it only runs when
    data.top-models lists them in review.properties (for example data.top-models =
    claude-opus-5-5, gpt-5). It looks for agents that only choose: no tools, an output_schema, and
    a prompt of ten lines or fewer. Check the quality with weave eval before and after switching.
  examples:
    fires:
      - file: examples/lc01-fires.loom
        settings: { data.top-models: "big-model" }
    quiet:
      - file: examples/lc01-quiet-small.loom
        settings: { data.top-models: "big-model" }
      - file: examples/lc01-quiet-tools.loom
        settings: { data.top-models: "big-model" }

- id: LC02
  lens: cost
  severity: low
  about: step
  when:
    all:
      - { field: kind, is: delegate }
      - any:
          - { field: inLoop, is: true }
          - { field: inForEach, is: true }
      - { field: agent.hasContext, is: false }
      - { field: agent.hasMemoryLimit, is: false }
  title: "{label} repeats with nothing bounding the conversation, so each round re-sends everything said so far"
  why: "Loom keeps one transcript of every task and answer in the run and puts all of it in front of the next agent. In a loop or for each it grows each round, so the cost of the rounds is not linear: ten rounds cost far more than ten times one."
  fixHint: "Bound the transcript: give the agent memory { max_tokens: ... } or a context block."
  since: "1.1.0"
  explain: >
    Measured against real providers while building this review: a loop of three rounds cost about
    twice what three independent calls cost, because round three carries rounds one and two. The
    shared transcript stops growing only where an agent sets memory { max_tokens } or has a
    context block. Bounding the loop with max limits the number of rounds; this rule is about
    what each round costs.
  examples:
    fires: [ examples/lc02-fires.loom, examples/lc02-fires-no-tools.loom ]
    quiet: [ examples/lc02-quiet-context.loom, examples/lc02-quiet-memory.loom, examples/lc02-quiet-no-loop.loom ]
