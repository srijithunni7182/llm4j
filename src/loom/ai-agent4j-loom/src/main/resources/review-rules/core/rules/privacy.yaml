- id: LY02
  lens: privacy
  severity: medium
  about: agent
  when:
    all:
      - { field: guardPii, is: warn }
      - { field: hasEffects, is: true }
  title: "Agent {name} only warns about personal data but can write or send"
  why: "A warning is written to a log and nothing stops the data. An agent that can write or send can pass personal data on."
  fixHint: "Change the guard to pii: mask (or block) so personal data is removed before it reaches the model or a tool."
  fix:
    safety: safe
    label: "Mask personal data instead of only warning"
    replaceText: { anchor: line, find: "pii: warn", text: "pii: mask" }
  since: "1.0.0"
  references: [LLM02]
  examples:
    fires: [ examples/ly02-fires.loom ]
    quiet: [ examples/ly02-quiet-mask.loom, examples/ly02-quiet-no-effects.loom ]

- id: LY01
  lens: privacy
  severity: medium
  about: step
  when:
    all:
      - { field: kind, is: delegate }
      - { field: payloadMentionsPersonal, is: true }
      - { field: agent.guardPii, in: [none, warn] }
  escalate:
    - when: { field: agent.hasEffects, is: true }
      severity: high
  title: "{label} sends a value that looks personal to the model and the agent has no guard that masks it"
  why: "An email address, phone number, address or a person's name filled into a prompt goes to the model provider as it is. A guard with pii: mask removes it first."
  fixHint: "Add guard { pii: mask } to the agent, or leave the personal value out of the prompt."
  since: "1.5.0"
  explain: >
    The prompt fills in a value whose name says it is personal (email, phone, address, dob, ssn,
    card, or a first, last or full name) or that data.personal in review.properties lists. The
    check goes by names, not by looking at the data, so name your fields plainly or list them.
  examples:
    fires: [ examples/ly01-fires.loom ]
    quiet: [ examples/ly01-quiet-mask.loom, examples/ly01-quiet-not-personal.loom ]

- id: LY04
  lens: privacy
  severity: medium
  about: agent
  when:
    all:
      - { field: feedsDecision, is: true }
      - { field: guardBias, is: none }
  title: "Agent {name} feeds a decision but has no bias guard"
  why: "When an agent's answer decides something, a bias guard is where unfair patterns are noticed or stopped."
  fixHint: "Add guard { bias: warn } (or block) to the agent."
  since: "1.5.0"
  examples:
    fires: [ examples/ly04-fires.loom ]
    quiet: [ examples/ly04-quiet-guarded.loom, examples/ly04-quiet-no-decision.loom ]

- id: LY05
  lens: privacy
  severity: medium
  about: classifier
  when:
    all:
      - { field: hasConfidenceRule, is: false }
  title: "Classifier {name} has no confidence rule, so doubtful answers are routed as if certain"
  why: "A classifier always answers. Without a confidence threshold a guess and a sure answer take the same path."
  fixHint: "Add confidence at least 0.8 else escalate to the classifier."
  since: "1.5.0"
  examples:
    fires: [ examples/ly05-fires.loom ]
    quiet: [ examples/ly05-quiet.loom ]

- id: LY06
  lens: privacy
  severity: medium
  about: agent
  when:
    all:
      - { field: promptHasPersonalData, is: true }
  title: "Agent {name}'s prompt holds an email address or phone number that looks real"
  why: "A real person's contact details in a prompt are committed with the script and sent to the provider on every call."
  fixHint: "Replace it with a placeholder such as jane@example.com."
  since: "1.5.0"
  examples:
    fires: [ examples/ly06-fires.loom ]
    quiet: [ examples/ly06-quiet.loom ]
