- id: LH01
  lens: oversight
  severity: medium
  about: step
  when:
    all:
      - { field: kind, is: decide }
      - { field: decideLacksLadder, is: true }
      - { field: followedByEffect, is: true }
  title: "{label} is followed by an action, and its decision has no ladder or trust"
  why: "The agent's choice leads to something being written or sent, and nothing in the script says how the agent earned the right to do that without a person."
  fixHint: "Give the decision a trust block that starts at watch, so a person sees every choice until the agent has a record."
  since: "1.6.0"
  explain: >
    A decision with a trust block (or a ladder) says how much freedom the agent has and how it
    earns more. Without either, whatever follows the decision runs on the agent's word alone.
  examples:
    fires: [ examples/lh01-fires.loom ]
    quiet: [ examples/lh01-quiet-trust.loom, examples/lh01-quiet-no-effect.loom ]

- id: LH02
  lens: oversight
  severity: low
  about: agent
  when:
    all:
      - { field: approvesLowReachTool, is: true }
  title: "Agent {name} asks a person to approve a tool that only reads"
  why: "When people are asked to approve things that cannot do harm, they learn to click yes without reading, and the approvals that matter get the same click."
  fixHint: "Remove the approval from the read-only tool, or declare that its reach is wider if it is."
  since: "1.6.0"
  explain: >
    Approval is for tools that write or send. Asking for it on a tool whose reach is declared as
    none or reads adds friction without protection.
  examples:
    fires: [ examples/lh02-fires.loom ]
    quiet: [ examples/lh02-quiet.loom ]

- id: LH04
  lens: oversight
  severity: low
  about: step
  when:
    all:
      - { field: kind, is: human_prompt }
      - { field: answerCompared, is: true }
  title: "{label} takes a free-text answer that a condition then compares"
  why: "People type 'Yes', 'yes ', 'y' and 'ok'. A comparison against one spelling takes the others for no."
  fixHint: "Ask a question with a fixed set of answers (a decide, or a prompt that tells the person to answer exactly yes or no) and compare against that."
  since: "1.6.0"
  explain: >
    Looks for a human_prompt whose variable is used in a later condition. The free-text answer is
    matched exactly, so only the spelling the author thought of works.
  examples:
    fires: [ examples/lh04-fires.loom ]
    quiet: [ examples/lh04-quiet.loom ]

- id: LH06
  lens: oversight
  severity: low
  about: step
  when:
    all:
      - { field: approvesLowEffectTool, is: true }
  title: "{label} asks a person to approve a tool that only reads"
  why: "When people are asked to approve things that cannot do harm, they learn to click yes without reading, and the approvals that matter get the same click."
  fixHint: "Remove approve from this step, or declare the tool's effect as changes (effect: changes) if it does change something."
  since: "6.2.0"
  explain: >
    The step form of LH02. A use step with approve on a tool whose effect is none or reads asks a
    person to confirm something that cannot do harm. Approval is for steps that send or change
    something.
  examples:
    fires: [ examples/lh06-fires.loom ]
    quiet: [ examples/lh06-quiet.loom ]

- id: LH05
  lens: oversight
  severity: medium
  about: agent
  when:
    all:
      - { field: asksMidWorkUnattended, is: true }
  title: "Agent {name} asks a person part-way through its work, in a workflow nobody is watching"
  why: "The run stops in the middle of the agent's reasoning and holds its whole conversation until someone answers, possibly hours later, from a phone. The person sees one tool call without the job it belongs to."
  fixHint: "Let the agent propose, then approve once at the edge: use Tool(...) approve, run Task(...) approve, or a decide. In an interactive assistant, an approval inside the loop is fine."
  since: "6.2.0"
  explain: >
    Fires when an agent's approve: covers a tool whose effect is changes and the script has a
    schedule, so no person is working with the agent. A workflow started by hand with weave run, or
    by a host application, counts as interactive and is not flagged. "Nobody watching" is read from
    the script, never guessed from prompts.
  examples:
    fires: [ examples/lh05-fires.loom ]
    quiet: [ examples/lh05-quiet-interactive.loom, examples/lh05-quiet-reads.loom ]
