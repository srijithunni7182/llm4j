# Prices used by ProviderSmokeIntegrationTest's SpendGuard: model = USD per million input tokens, USD per million output tokens.
# Each is the vendor's list price, read on 2026-10-22: https://developers.openai.com/api/docs/models/gpt-6-luna ($0.1 / $0.5),
# https://docs.x.ai/developers/models (grok-4.20 and grok-4.3: $1.25 / $2.50), and Perplexity's Agent API models page
# (https://docs.perplexity.ai/docs/agent-api/models.md: openai/gpt-6-luna $0.10 / $0.50, anthropic/claude-haiku-5-5 $0.10 / $0.50 up to 100k,
# google/gemini-3.7-flash $0.75 / $3.75). Perplexity also bills $2.50 per 1,000 web searches (not used by the smoke run).
# A model with no price counts as free, so a cap on an unpriced model (Kimi, Qwen) protects nothing: the runner refuses to run one.
gpt-6-luna = 0.10, 0.50
openai/gpt-6-luna = 0.10, 0.50
grok-4.20-0309-non-reasoning = 1.25, 2.50
grok-4.3 = 1.25, 2.50
claude-haiku-5-5 = 0.10, 0.50
gemini-3.7-flash = 0.75, 3.75
