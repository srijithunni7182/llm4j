# Context windows of models this library names, for ContextWindows.defaults(). Nothing here is applied unless you pass it to an agent:
#   ReActAgent.builder().budgetModel("claude-opus-5-5").contextWindows(ContextWindows.defaults())
# Format: model = window / tokens reserved for the reply. The reserve is the model's maximum output, the most it may use; a smaller
# max_tokens leaves more room than this assumes, so the windows here are on the safe side.
#
# Checked against https://platform.claude.com/docs/en/about-claude/models/overview on 2026-10-14
# (Context window "1M tokens", Max output "128K tokens", for all four current models). Entries are added only after they are checked
# against the provider's own documentation. Gemini and Sarvam models are not listed yet, nor are Qwen's smaller models; Ollama models depend on the model and on the
# num_ctx you run it with, so list your own.
claude-fable-5-1 = 1000000 / 128000
claude-opus-5-5 = 1000000 / 128000
claude-sonnet-5-5 = 1000000 / 128000
claude-haiku-5-5 = 1000000 / 128000

# OpenAI: https://developers.openai.com/api/docs/models/gpt-6.1-sol, /gpt-5.6, /gpt-5.5, /gpt-6-luna (checked 2026-10-22:
# 1,050,000 context window, 128,000 max output tokens). Other GPT-6 and GPT-5.6 variants are added when their pages are checked.
gpt-6.1-sol = 1050000 / 128000
gpt-6-luna = 1050000 / 128000
gpt-5.6 = 1050000 / 128000
gpt-5.6-sol = 1050000 / 128000
gpt-5.5 = 1050000 / 128000

# xAI: https://docs.x.ai/developers/models (checked 2026-10-22; the page gives the context, not a separate maximum output, so no reserve is listed)
grok-4.7 = 500000
grok-4.6 = 500000
grok-4.5 = 500000
grok-4.3 = 1000000
grok-4.20-0309-reasoning = 1000000
grok-4.20-0309-non-reasoning = 1000000

# Moonshot Kimi: https://platform.kimi.ai/docs/models.md (checked 2026-10-22; "256k" is listed as 256000 to stay on the safe side)
kimi-k3 = 1000000
kimi-k2.7-code = 256000
kimi-k2.7-code-highspeed = 256000
kimi-k2.6 = 256000

# Alibaba Qwen: https://www.alibabacloud.com/help/en/model-studio/text-generation-model.md (checked 2026-10-22: "1 million tokens")
qwen3.8-max = 1000000
qwen3.8-flash = 1000000
qwen3.7-plus = 1000000
qwen3.7-flash = 1000000
