# Context windows of models this library names, for ContextWindows.defaults(). Nothing here is applied unless you pass it to an agent:
#   ReActAgent.builder().budgetModel("claude-opus-5-5").contextWindows(ContextWindows.defaults())
# Format: model = window / tokens reserved for the reply. The reserve is the model's maximum output, the most it may use; a smaller
# max_tokens leaves more room than this assumes, so the windows here are on the safe side.
#
# Checked against https://platform.claude.com/docs/en/about-claude/models/overview on 2026-10-14
# (Context window "1M tokens", Max output "128K tokens", for all four current models). Entries are added only after they are checked
# against the provider's own documentation. Gemini and Sarvam models are not listed yet; Ollama models depend on the model and on the
# num_ctx you run it with, so list your own.
claude-fable-5-1 = 1000000 / 128000
claude-opus-5-5 = 1000000 / 128000
claude-sonnet-5-5 = 1000000 / 128000
claude-haiku-5-5 = 1000000 / 128000
