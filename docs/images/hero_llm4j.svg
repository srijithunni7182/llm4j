<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="llm4j: ai-agent4j, Loom and eval4j">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="120" y1="80" x2="1080" y2="330">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="gl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1a1040" stop-opacity="0.9"/><stop offset="60%" stop-color="#0b1330" stop-opacity="0.6"/><stop offset="100%" stop-color="#05060f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="24" fill="#05060f"/>
  <ellipse cx="600" cy="190" rx="640" ry="220" fill="url(#bg)"/>

  <text x="600" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="64" letter-spacing="8" fill="url(#g)" filter="url(#glow)">LLM4J</text>
  <text x="600" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="16" letter-spacing="5" fill="#8fd8ff">AI AGENTS, WRITTEN THE JAVA WAY</text>

  <!-- connectors -->
  <g stroke="url(#gl)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.7">
    <line x1="340" y1="205" x2="510" y2="205"/><line x1="690" y1="205" x2="860" y2="205"/>
  </g>

  <g fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- ai-agent4j: hexagon core with a node network -->
    <polygon points="317.5,244.0 250.0,283.0 182.5,244.0 182.5,166.0 250.0,127.0 317.5,166.0"/>
    <polygon points="295.0,231.0 250.0,257.0 205.0,231.0 205.0,179.0 250.0,153.0 295.0,179.0" stroke-width="3" opacity="0.6"/>
    <line x1="250" y1="205" x2="250" y2="165"/>
    <line x1="250" y1="205" x2="215" y2="225"/>
    <line x1="250" y1="205" x2="285" y2="225"/>
    <!-- Loom: three interlaced rounded bands -->
    <g transform="translate(600 205)">
      <rect x="-82" y="-26" width="164" height="52" rx="26" transform="rotate(0)"/>
      <rect x="-82" y="-26" width="164" height="52" rx="26" transform="rotate(60)"/>
      <rect x="-82" y="-26" width="164" height="52" rx="26" transform="rotate(120)"/>
      <rect x="-70" y="-14" width="140" height="28" rx="14" transform="rotate(0)" stroke-width="2.5" opacity="0.55"/>
      <rect x="-70" y="-14" width="140" height="28" rx="14" transform="rotate(60)" stroke-width="2.5" opacity="0.55"/>
      <rect x="-70" y="-14" width="140" height="28" rx="14" transform="rotate(120)" stroke-width="2.5" opacity="0.55"/>
    </g>
    <!-- eval4j: scales of justice -->
    <polygon points="961.0,135.0 955.5,144.5 944.5,144.5 939.0,135.0 944.5,125.5 955.5,125.5" stroke-width="5"/>
    <line x1="950" y1="146" x2="950" y2="267"/>
    <line x1="875" y1="163" x2="1025" y2="163"/>
    <line x1="880" y1="163" x2="868" y2="203"/>
    <line x1="1020" y1="163" x2="1032" y2="203"/>
    <polygon points="884.0,217.0 876.0,230.9 860.0,230.9 852.0,217.0 860.0,203.1 876.0,203.1" stroke-width="5"/>
    <polygon points="1048.0,217.0 1040.0,230.9 1024.0,230.9 1016.0,217.0 1024.0,203.1 1040.0,203.1" stroke-width="5"/>
    <line x1="950" y1="267" x2="916" y2="287"/>
    <line x1="950" y1="267" x2="984" y2="287"/>
  </g>
  <g fill="#f0abfc" filter="url(#glow)">
    <circle cx="250" cy="205" r="8"/><circle cx="250" cy="165" r="5"/><circle cx="215" cy="225" r="5"/><circle cx="285" cy="225" r="5"/>
    <circle cx="600" cy="205" r="6"/>
    <circle cx="950" cy="135" r="4"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="250" y="328" font-weight="800" font-size="26" letter-spacing="2" fill="#e6f7ff">ai-agent4j</text>
    <text x="250" y="352" font-size="14" letter-spacing="2" fill="#8fd8ff">BUILD AGENTS</text>
    <text x="600" y="328" font-weight="800" font-size="26" letter-spacing="2" fill="#e6f7ff">Loom</text>
    <text x="600" y="352" font-size="14" letter-spacing="2" fill="#8fd8ff">ORCHESTRATE THEM</text>
    <text x="950" y="328" font-weight="800" font-size="26" letter-spacing="2" fill="#e6f7ff">eval4j</text>
    <text x="950" y="352" font-size="14" letter-spacing="2" fill="#8fd8ff">TRUST THEM</text>
  </g>
</svg>
