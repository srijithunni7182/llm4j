<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Most complete explainable-AI toolkit for Java agents</title>
  <desc id="d">llm4j builds explainable AI into the framework: traceability, uncertainty and escalation, PII privacy, and fairness monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accent)"/>
  <text x="600" y="70" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#94a3b8">EXPLAINABLE AI (xAI)</text>
  <text x="600" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#f8fafc">The most complete explainable-AI toolkit for Java agents</text>
  <text x="600" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#cbd5e1">Built in, not bolted on · mapped to GDPR, the EU AI Act and the NIST AI RMF</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">
    <rect x="60"  y="182" width="250" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.7"/>
    <text x="185" y="210">🔍 Traceability</text>
    <rect x="335" y="182" width="270" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.7"/>
    <text x="470" y="210">⚖️ Confidence &amp; escalation</text>
    <rect x="630" y="182" width="250" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="755" y="210">🛡️ PII privacy</text>
    <rect x="905" y="182" width="235" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="1022" y="210">🏳️ Fairness</text>
  </g>
</svg>
