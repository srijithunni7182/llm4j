server.port=8090

tantrik.console.cors.origins=http://localhost:5173,http://localhost:3000
tantrik.console.loom-scripts.dir=./loom-scripts
tantrik.console.engram.storage-path=./engram-memory.json

info.app.version=@project.version@

# ── Logging ───────────────────────────────────────────────────────────────────
# Show all incoming requests with method, URI, status, and timing
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.io.github.llm4j.tantrik.console=DEBUG

# Log request/response details (Spring Boot actuator-style)
spring.mvc.log-request-details=true

# Pattern: timestamp | level | logger | message
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{36}] %msg%n
