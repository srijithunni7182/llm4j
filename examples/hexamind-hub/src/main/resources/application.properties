server.port=8080
spring.application.name=hexamind-hub

# Google API Key
google.api.key=${GOOGLE_API_KEY}
google.search.cx=${GOOGLE_SEARCH_CX:}
serpapi.api.key=${SERPAPI_API_KEY:}

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/hexamind-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/calendar

# OAuth2 - GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=user:email

# Logging
logging.level.io.github.llm4j=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
