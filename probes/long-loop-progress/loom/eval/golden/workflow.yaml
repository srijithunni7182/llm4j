# The requirements of this starter, as one end-to-end case: what the run must have done, and what the answer must be.
- id: workflow-001
  name: A normal request
  input: "Prepare a three-point summary of the meeting notes"
  expect:
    - "Worker did one small step at a time"
    - "Progress recorded what is done and what is next"
  rubric:
    - "The loop stops when the goal is reached or its limit is"
    - "Progress is a typed value the script keeps"
